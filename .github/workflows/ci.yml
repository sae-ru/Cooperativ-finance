name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create ephemeral test secrets
        run: sh ./scripts/bootstrap-node.sh
      - name: Build backend test image
        run: docker compose --profile test build migrate-test backend-tests
      - name: Run lint, type checks, unit and integration tests
        run: |
          docker compose --profile test run --rm backend-tests \
            sh -c "ruff check src tests && mypy && pytest -m 'not acceptance' --cov --cov-report=term-missing"
      - name: Stop test services
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans

  critical-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create ephemeral test secrets
        run: bash ./scripts/bootstrap-node.sh
      - name: Run migration, OpenAPI, property and repeated concurrency gates
        run: bash ./scripts/test-critical-quality.sh 3
      - name: Upload critical quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-quality-evidence
          path: evidence/quality-*
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build frontend test image
        run: docker build --target test --tag cooperative-clearing/frontend-test:ci frontend
      - name: Run type checks, unit tests and production build
        run: |
          docker run --rm cooperative-clearing/frontend-test:ci \
            sh -c "pnpm typecheck && pnpm test:coverage && pnpm build"

  stack-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create ephemeral node configuration
        run: sh ./scripts/bootstrap-node.sh
      - name: Start complete node
        run: docker compose up --detach --build
      - name: Verify gateway and operational status
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose ps --all
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null
          curl --fail --silent http://127.0.0.1:8080/api/v1/system/status \
            | python -c 'import json,sys; value=json.load(sys.stdin)["data"]; assert value["status"] == "OPERATIONAL"; assert value["node"]["demo_data_loaded"] is True; assert value["worker"]["status"] == "RUNNING"'
      - name: Stop smoke stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  federation-acceptance:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run three-node clearing acceptance
        run: sh ./scripts/test-federation.sh

  supply-chain:
    needs: [backend, frontend, critical-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test release bundle fail-closed contract
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Validate operator scripts
        shell: pwsh
        run: |
          python -m py_compile scripts/release_bundle.py scripts/openapi_compat.py scripts/tests/test_release_bundle.py scripts/tests/test_openapi_compat.py
          Get-ChildItem scripts -Filter *.sh | ForEach-Object {
            bash -n $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $tokens = $null
          $errors = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
          }
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }
      - name: Build release images with SBOM and provenance
        run: |
          docker buildx build --target runtime --sbom=true --provenance=mode=max \
            --load --tag cooperative-clearing/backend:ci-contract backend
          docker buildx build --target runtime --sbom=true --provenance=mode=max \
            --load --tag cooperative-clearing/frontend:ci-contract frontend
          docker buildx build --sbom=true --provenance=mode=max \
            --load --tag cooperative-clearing/gateway:ci-contract infra/gateway
          docker build --target test \
            --tag cooperative-clearing/frontend-test:ci-contract frontend
          docker pull postgres:18-alpine
      - name: Create and independently verify signed offline release
        run: |
          python scripts/release_bundle.py generate-keypair \
            --private-key "$RUNNER_TEMP/release-private.pem" \
            --public-key "$RUNNER_TEMP/release-public.pem"
          python scripts/release_bundle.py create \
            --release ci-contract \
            --output "$RUNNER_TEMP/release-bundle" \
            --private-key "$RUNNER_TEMP/release-private.pem" \
            --frontend-audit-image cooperative-clearing/frontend-test:ci-contract
          policy_sha="$(sha256sum "$RUNNER_TEMP/release-bundle/metadata/license-policy.json" | cut -d' ' -f1)"
          python scripts/release_bundle.py verify \
            --bundle "$RUNNER_TEMP/release-bundle" \
            --public-key "$RUNNER_TEMP/release-public.pem" \
            --expected-release ci-contract \
            --expected-policy-sha256 "$policy_sha" \
            --load-images
          mkdir -p artifacts
          mv "$RUNNER_TEMP/release-bundle" artifacts/release-bundle
          cp "$RUNNER_TEMP/release-public.pem" artifacts/ci-release-public.pem
          rm -f "$RUNNER_TEMP/release-private.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-offline-release-contract
          path: artifacts
          retention-days: 14